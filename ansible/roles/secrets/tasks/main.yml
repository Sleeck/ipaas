---
# llm.env : même format que la version bash (on peut passer de l'une à l'autre).
- name: Fichier llm.env (créé s'il n'existe pas)
  ansible.builtin.copy:
    dest: "{{ cred_dir }}/llm.env"
    force: false
    mode: "0600"
    content: |
      # llm.env v2
      # Clé API Anthropic (https://console.anthropic.com > API Keys), donnée UNIQUEMENT à LiteLLM.
      ANTHROPIC_API_KEY=
      # Modèle Claude utilisé partout : claude-opus-5-5, claude-sonnet-5-5 ou claude-haiku-5-5
      CLAUDE_MODEL=claude-opus-5-5
      # Optionnel : embeddings pour la mémoire de PentAGI
      EMBEDDING_PROVIDER=
      EMBEDDING_MODEL=
      EMBEDDING_URL=
      EMBEDDING_KEY=
      # Optionnel : modèle Strix (vide = openai/<CLAUDE_MODEL> via LiteLLM)
      STRIX_LLM=

- name: Clé Anthropic fournie au lancement
  ansible.builtin.lineinfile:
    path: "{{ cred_dir }}/llm.env"
    regexp: '^ANTHROPIC_API_KEY='
    line: "ANTHROPIC_API_KEY={{ anthropic_api_key }}"
  when: anthropic_api_key | length > 0
  no_log: true

- name: Modèle et options LLM
  ansible.builtin.lineinfile:
    path: "{{ cred_dir }}/llm.env"
    regexp: '^{{ item.key }}='
    line: "{{ item.key }}={{ item.value }}"
  loop:
    - { key: CLAUDE_MODEL, value: "{{ claude_model }}" }
    - { key: EMBEDDING_PROVIDER, value: "{{ embedding_provider }}" }
    - { key: EMBEDDING_MODEL, value: "{{ embedding_model }}" }
    - { key: EMBEDDING_URL, value: "{{ embedding_url }}" }
    - { key: EMBEDDING_KEY, value: "{{ embedding_key }}" }
    - { key: STRIX_LLM, value: "{{ strix_llm }}" }
  loop_control:
    label: "{{ item.key }}"
  when: item.key == 'CLAUDE_MODEL' or (item.value | length > 0)

- name: Mots de passe et clés internes (générés une seule fois)
  ansible.builtin.script:
    cmd: "ensure-secrets.sh {{ cred_dir }}/.pentagi-secrets.env"
  register: secrets_gen
  changed_when: "'added:' in secrets_gen.stdout"

- name: Lecture de llm.env
  ansible.builtin.script:
    cmd: "env2json.py {{ cred_dir }}/llm.env"
    executable: /usr/bin/python3
  register: llm_raw
  check_mode: false
  changed_when: false
  no_log: true

- name: Lecture des secrets
  ansible.builtin.script:
    cmd: "env2json.py {{ cred_dir }}/.pentagi-secrets.env"
    executable: /usr/bin/python3
  register: secrets_raw
  check_mode: false
  changed_when: false
  no_log: true

- name: Variables LLM et secrets disponibles pour les rôles suivants
  ansible.builtin.set_fact:
    llm: "{{ llm_raw.stdout | from_json }}"
    sec: "{{ secrets_raw.stdout | from_json }}"
  no_log: true
